name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & test (win32-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # 打包阶段由 @electron/packager 自行下载运行时，这里不必再下一次
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run unit tests
        run: npm test

      - name: Build exe
        run: npm run build:exe

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path 'release\CDriveScout-win32-x64\*' -DestinationPath 'CDriveScout-win32-x64.zip' -Force
          $size = (Get-Item 'CDriveScout-win32-x64.zip').Length / 1MB
          Write-Host ("zip 大小: {0:N1} MB" -f $size)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDriveScout-win32-x64
          path: CDriveScout-win32-x64.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CDriveScout-win32-x64.zip
          generate_release_notes: true
