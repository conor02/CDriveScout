# ============================================================
#  C 盘透视 · 规则文件
#  改完保存，点界面上的「重新加载规则」即可生效，无需重启。
#
#  [system] 段：系统保护区路径（前缀匹配，命中即视为系统目录）
#  [protect] 段：禁止删除/迁移的目录（前缀匹配，优先级高于一切规则）
#  [rules]  段：分类规则，从上到下依次匹配，第一条命中即生效
#
#  规则格式（用 | 分隔 5~6 段）：
#     分类 | 匹配方式 | 模式 | 建议动作 | 判断依据 | [sys]
#
#  第 6 段可选写 sys：表示「即使文件在系统目录内，也保留这条规则的建议」。
#  默认情况下，系统目录（C:\Windows、Program Files 等）里的文件，
#  只有「可安全清理」能穿透，其余一律降级为系统保护区。
#
#  匹配方式：
#     contains  路径包含该片段（不区分大小写，建议以 \ 结尾避免误伤）
#     prefix    路径以该片段开头
#     ext       文件扩展名，如 .iso
#     name      文件名完全相同，如 thumbs.db
#
#  分类只能是：可安全清理 / 建议迁移 / 需确认
#  （系统保护区与其他分类由程序自动判定，不需要写规则）
# ============================================================

[system]
C:\Windows
C:\Program Files
C:\Program Files (x86)
C:\ProgramData
C:\Recovery
C:\PerfLogs
C:\Boot
C:\$Recycle.Bin
C:\System Volume Information
C:\pagefile.sys
C:\hiberfil.sys
C:\swapfile.sys

[protect]
# 这里列出的目录，界面上不允许勾选，主进程在执行前也会再拦一次。
# 按自己的重要资料目录补充，一行一个，前缀匹配。
# ⚠️ 下面是示例占位，装好后请改成你自己的路径，把 <用户名> 换成实际用户名：
#     C:\Users\<用户名>\Documents
#     C:\Users\<用户名>\OneDrive
#     D:\资料备份
C:\Users\User\Documents\Private
C:\Users\User\OneDrive\重要资料

[rules]
# ---------- 可安全清理：缓存、临时文件、日志 ----------
可安全清理|contains|\windows\temp\|删除|Windows 临时目录，系统会重建
可安全清理|contains|\softwaredistribution\download\|删除|Windows 更新下载缓存
可安全清理|contains|\crashdumps\|删除|崩溃转储文件
可安全清理|contains|\inetcache\|删除|系统网页缓存
可安全清理|contains|\code cache\|删除|浏览器 JS 代码缓存
可安全清理|contains|\gpucache\|删除|GPU 着色器缓存
可安全清理|contains|\service worker\cachestorage\|删除|浏览器离线缓存
可安全清理|contains|\.cache\|删除|应用缓存目录，删除后自动重建
可安全清理|contains|\caches\|删除|应用缓存目录，删除后自动重建
可安全清理|contains|\cache\|删除|应用缓存目录，删除后自动重建
可安全清理|contains|\temp\|删除|临时文件
可安全清理|contains|\logs\|删除|日志文件，可清理
可安全清理|contains|\npm-cache\|删除|npm 包缓存，会按需重新下载
可安全清理|contains|\pip\cache\|删除|pip 包缓存
可安全清理|contains|\nuget\v3-cache\|删除|NuGet 包缓存
可安全清理|contains|\.gradle\caches\|删除|Gradle 构建缓存
可安全清理|contains|\yarn\cache\|删除|Yarn 包缓存
可安全清理|ext|.tmp|删除|临时文件
可安全清理|ext|.dmp|删除|内存转储文件
可安全清理|ext|.etl|删除|事件跟踪日志
可安全清理|name|thumbs.db|删除|缩略图缓存，会自动重建
可安全清理|name|desktop.ini|删除|文件夹显示配置，会自动重建

# ---------- 建议迁移：用户数据、大目录 ----------
建议迁移|contains|\downloads\|迁移|下载目录，建议整体迁到 D 盘
建议迁移|contains|\desktop\|迁移|桌面大文件，建议迁到 D 盘
建议迁移|contains|\videos\|迁移|视频文件，建议迁到 D 盘
建议迁移|contains|\pictures\|迁移|图片文件，建议迁到 D 盘
建议迁移|contains|\wechat files\|迁移|微信文件，先在微信设置里改存储路径
建议迁移|contains|\xwechat_files\|迁移|微信 4.x 文件，先在设置里改路径
建议迁移|contains|\tencent files\|迁移|QQ 文件，先在 QQ 设置里改路径
建议迁移|contains|\steamapps\|迁移|Steam 游戏库，用 Steam 自带迁移功能
建议迁移|contains|\epic games\|迁移|Epic 游戏，可用启动器迁移
建议迁移|contains|\battle.net\|迁移|战网游戏，可用启动器迁移
建议迁移|ext|.iso|迁移|镜像文件，建议移出 C 盘
建议迁移|ext|.vmdk|需确认|虚拟机磁盘，确认后再移动

# ---------- 需确认：大文件、安装包、虚拟磁盘 ----------
需确认|contains|\docker\|需确认|Docker 数据，按官方方式清理或迁移|sys
需确认|contains|\drvpath\|需确认|驱动解压缓存，确认后再删
需确认|ext|.vhdx|需确认|WSL/Docker 虚拟磁盘，用官方方式迁移
需确认|ext|.vdi|需确认|虚拟机磁盘，确认后再移动
需确认|ext|.zip|需确认|压缩包，确认是否还需要
需确认|ext|.7z|需确认|压缩包，确认是否还需要
需确认|ext|.rar|需确认|压缩包，确认是否还需要
需确认|ext|.mp4|需确认|视频文件，确认是否还需要
需确认|ext|.mkv|需确认|视频文件，确认是否还需要
需确认|ext|.msi|需确认|安装包，装完可删
需确认|ext|.exe|需确认|程序或安装包，确认后再动
需确认|ext|.nupkg|需确认|包文件，确认后再动
